[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentps"
dynamic = ["version"]
description = "ps-like inventory of CLI coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HAMKEE", email = "hello@hamkee.net" }]
keywords = ["cli", "sessions", "process", "coding-agent", "claude", "codex",
            "gemini", "opencode", "ps", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hamkee-dev-group/agentps"
Repository = "https://github.com/hamkee-dev-group/agentps"
Issues = "https://github.com/hamkee-dev-group/agentps/issues"
Changelog = "https://github.com/hamkee-dev-group/agentps/commits/main"

[project.scripts]
agentps = "agentps.cli:main"

# Single source of truth for the version: agentps/__init__.py
[tool.setuptools.dynamic]
version = { attr = "agentps.__version__" }

[tool.setuptools.packages.find]
include = ["agentps*"]
